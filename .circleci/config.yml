version: 2.1
orbs:
  ruby: circleci/ruby@1.1.4
  aws-s3: circleci/aws-s3@3.0

jobs:
  build:
    executor:
      name: ruby/default
      tag: "3.4"
    steps:
      - checkout
      - ruby/install-deps:
          key: ruby-cache-{{checksum "Gemfile"}}
      - run:
          name: Build
          command: bundle exec jekyll build
      - run:
          name: Proof
          command: bundle exec htmlproofer ./_site --disable-external --allow-hash-href
      - aws-s3/sync:
          from: ./_site
          to: 's3://javahippie-net'

workflows:
  test-build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - master
