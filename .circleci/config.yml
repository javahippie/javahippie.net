version: 2.1
orbs:
  ruby: circleci/ruby@1.1.4
  aws-s3: circleci/aws-s3@3.0

jobs:
  build:
    executor:
      name: ruby/default
      tag: "3.4"
    steps:
      - checkout
      - ruby/install-deps:
          key: ruby-cache-{{checksum "Gemfile"}}
      - restore_cache:
          key: html2gmi-v1
      - run:
          name: Install md2gemini
          command: |
            sudo apt-get update && sudo apt-get install -y pipx
            pipx install md2gemini
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Build
          command: bundle exec jekyll build
      - run:
          name: Proof
          command: bundle exec htmlproofer ./_site --disable-external --allow-hash-href --no-enforce-https
      - aws-s3/sync:
          from: ./_site
          to: 's3://javahippie-net'

workflows:
  test-build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - master
